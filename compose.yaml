name: inf6303-devoir2-spark

x-spark-common: &spark-common
  image: inf6303-spark-mllib:4.2.0
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes:
    - ./:/workspace
  networks: [spark-devoir2]

services:
  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.master.Master, --host, spark-master, --port, "7077", --webui-port, "8080"]
    ports: ["7077:7077", "8080:8080"]
  spark-worker:
    <<: *spark-common
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, spark://spark-master:7077, --cores, "1", --memory, 1400m, --webui-port, "8081"]
    depends_on: [spark-master]
  spark-client:
    <<: *spark-common
    hostname: spark-client
    command: [bash, -lc, "trap : TERM INT; sleep infinity & wait"]
    depends_on: [spark-master]
    ports: ["4040:4040"]

networks:
  spark-devoir2:
    driver: bridge
